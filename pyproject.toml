[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raptor-vision"
version = "0.1.0"
description = "Scene understanding for security cameras: labelled regions from a picture, shared by Kestrel and Osprey."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["Pillow>=10.0"]

[project.optional-dependencies]
segment = ["numpy>=1.26", "onnxruntime>=1.17"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "numpy>=1.26", "onnxruntime>=1.17"]

[project.urls]
Homepage = "https://github.com/grayslawson/raptor-vision"

[tool.hatch.build.targets.wheel]
packages = ["src/raptor_vision"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
